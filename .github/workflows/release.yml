name: Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup CUDA Toolkit
      id: cuda-toolkit
      uses: Jimver/cuda-toolkit@v0.2.14
      with:
        cuda: '12.2.0'
        method: 'network'
        use-github-cache: false
        use-local-cache: false

    - name: Build
      shell: cmd
      run: |
        echo [CUDA] Compiling GPU Kernels...
        set "CUDA_OBJ="
        set "CUDA_DEF="
        nvcc.exe -O3 -allow-unsupported-compiler -c "gpu_kernels.cu" -o "gpu_kernels.obj" -Iinclude -I"%CUDA_PATH%\include"
        if %errorlevel% equ 0 set "CUDA_OBJ=gpu_kernels.obj cudart.lib"
        if %errorlevel% equ 0 set "CUDA_DEF=/DENABLE_CUDA"

        echo [CPP] Compiling Host Code (C++20)...
        cl.exe /EHsc /std:c++20 /O2 %CUDA_DEF% /c "cerberus.cpp" /Fo:"cerberus.obj" /Iinclude /I"%CUDA_PATH%\include"
        if %errorlevel% neq 0 exit /b %errorlevel%
        
        cl.exe /EHsc /std:c++20 /O2 /c "opencl_kernels.cpp" /Fo:"opencl_kernels.obj" /Iinclude /I"%CUDA_PATH%\include"
        if %errorlevel% neq 0 exit /b %errorlevel%

        echo [LINK] Linking Executable...
        link.exe /OUT:"cerberus.exe" "cerberus.obj" "opencl_kernels.obj" %CUDA_OBJ% OpenCL.lib /LIBPATH:lib\x64 /LIBPATH:"%CUDA_PATH%\lib\x64"
        if %errorlevel% neq 0 exit /b %errorlevel%

        echo [COPY] Copying CUDA Runtime DLLs...
        if exist "%CUDA_PATH%\bin\cudart64_*.dll" copy "%CUDA_PATH%\bin\cudart64_*.dll" .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cerberus_Forensic_Suite
        path: |
          cerberus.exe
          *.dll
        if-no-files-found: warn

    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v3.0.${{ github.run_number }}
        name: CERBERUS v3.0.${{ github.run_number }}
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
        body: |
          ## 🔱 CERBERUS v3.0 — The Triple-Headed Forensic Engine
          Industrial-grade cryptographic recovery and forensic audit framework.

          ### 🚀 What's New in v3.0:
          - **Triple-Headed Architecture:** Potfile Cache (0ms instant recovery) + Rule-Based Mutation Dictionary + Massive GPU/CPU Parallel Brute Force.
          - **Universal GPU Acceleration:** OpenCL 3.0 JIT kernels (~860+ MH/s on GTX 1070) + NVIDIA CUDA Native Runtime.
          - **Comprehensive 18-Module Matrix:** MD5, SHA-1, SHA-224, SHA-256, SHA-384, SHA-512, NTLM (SAM/AD), MD4, CRC32, Base64, HMAC, PBKDF2, Bcrypt, Scrypt, and Social Media profiles.
          - **UX & Telemetry Overhaul:** Dynamic single-line progress telemetry (ETA, hashrate, progress bar), 76-column forensic result cards, and multi-hash batch file executive reports.
          - **DevOps & Scripting:** Added `--quiet` (`-q`) for Unix pipelines and `--json` for SIEM / automated forensic toolchains.
          - **Built-in History Viewer:** New `cerberus history` / `cerberus potfile` command.
        files: |
          cerberus.exe
          *.dll
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
