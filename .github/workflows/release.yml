name: Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Locate Visual Studio
      shell: pwsh
      run: |
        $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
        if (-not (Test-Path -LiteralPath $vswhere)) {
          throw "vswhere.exe was not found at $vswhere"
        }
        $vsPath = & $vswhere -latest -products '*' -requires 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' -property installationPath | Select-Object -First 1
        if ([string]::IsNullOrWhiteSpace($vsPath)) {
          throw 'Visual Studio C++ x64 build tools were not found on the runner.'
        }
        "VS_PATH=$($vsPath.Trim())" >> $env:GITHUB_ENV

    - name: Setup CUDA Toolkit
      id: cuda-toolkit
      uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
      with:
        cuda: '12.9.1'
        method: 'network'
        use-github-cache: false
        use-local-cache: false

    - name: Build
      shell: cmd
      run: |
        call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
        if errorlevel 1 exit /b 1

        if not defined CUDA_PATH (
          echo [ERROR] CUDA Toolkit was not installed by the setup step.
          exit /b 1
        )
        if not exist "%CUDA_PATH%\bin\nvcc.exe" (
          echo [ERROR] nvcc.exe was not found under "%CUDA_PATH%\bin".
          exit /b 1
        )

        echo [CUDA] Compiling GPU Kernels...
        "%CUDA_PATH%\bin\nvcc.exe" --version
        if errorlevel 1 exit /b 1
        "%CUDA_PATH%\bin\nvcc.exe" -O3 -allow-unsupported-compiler -arch=all -Xcompiler=/MT -c "src\algorithms\gpu_kernels.cu" -o "gpu_kernels.obj" -Idependencies\opencl\include -I"%CUDA_PATH%\include"
        if errorlevel 1 (
          echo [ERROR] CUDA kernel compilation failed; refusing to publish a CPU/OpenCL-only release.
          exit /b 1
        )
        if not exist "gpu_kernels.obj" (
          echo [ERROR] CUDA compiler returned success without producing gpu_kernels.obj.
          exit /b 1
        )
        set "CUDA_OBJ=gpu_kernels.obj cudart.lib"
        set "CUDA_DEF=/DENABLE_CUDA"

        echo [CPP] Compiling Host Code (C++20)...
        cl.exe /EHsc /std:c++20 /utf-8 /O2 /MT %CUDA_DEF% /c "src\cerberus.cpp" /Fo:"cerberus.obj" /Idependencies\opencl\include /I"%CUDA_PATH%\include"
        if %errorlevel% neq 0 exit /b %errorlevel%
        
        cl.exe /EHsc /std:c++20 /utf-8 /O2 /MT /c "src\algorithms\opencl_kernels.cpp" /Fo:"opencl_kernels.obj" /Idependencies\opencl\include /I"%CUDA_PATH%\include"
        if %errorlevel% neq 0 exit /b %errorlevel%

        echo [C] Compiling bcrypt implementation...
        cl.exe /O2 /MT /c "dependencies\crypt_blowfish\crypt_blowfish.c" /Fo:"crypt_blowfish.obj"
        if %errorlevel% neq 0 exit /b %errorlevel%

        echo [LINK] Linking Executable...
        link.exe /OUT:"cerberus.exe" "cerberus.obj" "opencl_kernels.obj" "crypt_blowfish.obj" %CUDA_OBJ% /LIBPATH:"%CUDA_PATH%\lib\x64"
        if %errorlevel% neq 0 exit /b %errorlevel%

        echo [COPY] Copying CUDA Runtime DLLs...
        if not exist "%CUDA_PATH%\bin\cudart64_*.dll" (
          echo [ERROR] CUDA runtime DLL is missing from the CUDA build.
          exit /b 1
        )
        copy /Y "%CUDA_PATH%\bin\cudart64_*.dll" .
        if errorlevel 1 exit /b 1

    - name: Run independent correctness and false-positive suite
      shell: cmd
      env:
        CERBERUS_TEST_CUDA: '1'
      run: py -3 -m unittest discover -s tests -p "test_*.py" -v

    - name: Upload Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Cerberus_Forensic_Suite
        path: |
          cerberus.exe
          setup.bat
          *.dll
          README.md
          LICENSE
          licenses/LICENSE-APACHE-2.0.txt
          licenses/LICENSE-MIT-picosha2.txt
          licenses/LICENSE-crypt_blowfish.txt
          licenses/THIRD_PARTY_NOTICES.md
          data/lists/wordlist.txt
          data/lists/saltlist.txt
        if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: Cerberus_Forensic_Suite
        path: .

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: v3.0.${{ github.run_number }}
        name: CERBERUS v3.0.${{ github.run_number }}
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
        body: |
          ## 🔱 CERBERUS v3.0 — The Triple-Headed Forensic Engine
          Windows utility for authorized cryptographic recovery and forensic audits.

          ### 🚀 What's New in v3.0:
          - **Recovery workflow:** Potfile cache + rule-based dictionary mutations + parallel GPU/CPU search for supported algorithms.
          - **GPU Acceleration:** OpenCL 1.2+ and CUDA kernels for MD5, SHA-1, SHA-256, SHA-512, NTLM, and MD4. Salted MD5/SHA-1/SHA-256/SHA-512 reuse their corresponding kernels. Other implemented algorithms run on CPU.
          - **Implemented Recovery Formats:** MD5, SHA-1, SHA-224, SHA-256, SHA-384, SHA-512, NTLM, MD4, CRC32, Base64 decoding, HMAC-MD5/SHA-1/SHA-256, salted MD5/SHA-1/SHA-256/SHA-512, WPA2 PMK, bcrypt, and scrypt PHC. WPA3 SAE passive captures do not permit generic offline password verification; official social data exports are account-content archives, not password-hash formats.
          - **UX & Telemetry Overhaul:** Dynamic single-line progress telemetry (ETA, hashrate, progress bar), 76-column forensic result cards, and multi-hash batch file executive reports.
          - **DevOps & Scripting:** Added `--quiet` (`-q`) for Unix pipelines and `--json` for SIEM / automated forensic toolchains.
          - **Built-in History Viewer:** New `cerberus history` / `cerberus potfile` command.
        files: |
          cerberus.exe
          setup.bat
          *.dll
          README.md
          LICENSE
          licenses/LICENSE-APACHE-2.0.txt
          licenses/LICENSE-MIT-picosha2.txt
          licenses/LICENSE-crypt_blowfish.txt
          licenses/THIRD_PARTY_NOTICES.md
          data/lists/wordlist.txt
          data/lists/saltlist.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
